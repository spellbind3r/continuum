<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuum - Historical World Explorer</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto 1fr;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        header {
            grid-column: 1 / -1;
            background: #16213e;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #0f3460;
            font-size: 28px;
        }

        .time-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 600px;
        }

        .time-slider-container {
            width: 100%;
            position: relative;
        }

        .time-slider {
            width: 100%;
        }

        .time-markers {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 5px;
            font-size: 11px;
            color: #999;
        }

        .time-marker {
            text-align: center;
            flex: 1;
        }

        #year-display {
            font-size: 20px;
            font-weight: bold;
            color: #e94560;
            min-width: 120px;
            text-align: center;
        }

        #map {
            height: 100%;
            border-radius: 8px;
            border: 2px solid #0f3460;
        }

        .info-panel {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            border: 2px solid #0f3460;
        }

        .category {
            margin-bottom: 20px;
            padding: 15px;
            background: #1a1a2e;
            border-radius: 6px;
            border-left: 4px solid #e94560;
        }

        .category h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .category-content {
            color: #ddd;
            line-height: 1.6;
        }

        .confidence-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #f39c12);
            transition: width 0.3s ease;
        }

        .confidence-label {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .location-info {
            background: #0f3460;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .location-info h2 {
            color: #fff;
            margin-bottom: 5px;
        }

        .location-info p {
            color: #aaa;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            color: #999;
            margin-bottom: 10px;
        }

        .category-icons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .category-icon {
            background: #1a1a2e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .category-icon:hover {
            background: #0f3460;
            border-color: #e94560;
            transform: translateY(-2px);
        }

        .category-icon.active {
            background: #0f3460;
            border-color: #e94560;
        }

        .category-icon .icon {
            font-size: 18px;
        }

        /* Loading spinner */
        .spinner {
            width: 50px;
            height: 50px;
            margin: 20px auto;
            border: 4px solid #333;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-message {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .loading-message p {
            margin-top: 10px;
            font-size: 14px;
        }

        /* Cache indicator */
        .cache-badge {
            display: inline-block;
            background: #0f3460;
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 10px;
        }

        /* Fade in animation */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Debug panel */
        .debug-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f3460;
            color: #fff;
            border: 2px solid #e94560;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .debug-toggle:hover {
            background: #e94560;
            transform: scale(1.05);
        }

        .debug-panel {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 350px;
            max-height: 400px;
            background: #16213e;
            border: 2px solid #e94560;
            border-radius: 8px;
            padding: 15px;
            z-index: 999;
            overflow-y: auto;
            display: none;
            font-size: 12px;
        }

        .debug-panel.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .debug-panel h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .debug-item {
            background: #1a1a2e;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid #0f3460;
        }

        .debug-item.success {
            border-left-color: #4ade80;
        }

        .debug-item.warning {
            border-left-color: #f39c12;
        }

        .debug-item label {
            color: #999;
            font-size: 10px;
            text-transform: uppercase;
        }

        .debug-item value {
            color: #fff;
            display: block;
            margin-top: 4px;
        }

        .debug-json {
            background: #0a0a0a;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #4ade80;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Continuum</h1>
            <div class="time-control">
                <span id="year-display">2024 CE</span>
                <div class="time-slider-container">
                    <input type="range" id="time-slider" class="time-slider"
                           min="0" max="100" value="100" step="1">
                    <div class="time-markers">
                        <div class="time-marker" style="left: 0%;">3000 BCE</div>
                        <div class="time-marker" style="left: 20%;">2000 BCE</div>
                        <div class="time-marker" style="left: 30%;">0 CE</div>
                        <div class="time-marker" style="left: 45%;">Medieval</div>
                        <div class="time-marker" style="left: 60%;">1500</div>
                        <div class="time-marker" style="left: 80%;">1900</div>
                        <div class="time-marker" style="left: 100%;">Today</div>
                    </div>
                </div>
            </div>
        </header>

        <div id="map"></div>

        <div class="info-panel" id="info-panel">
            <div class="empty-state">
                <h3>👆 Click anywhere on the map</h3>
                <p>Explore history across time and space</p>
            </div>
        </div>
    </div>

    <!-- Debug Panel -->
    <button class="debug-toggle" onclick="toggleDebug()">🔧 Debug</button>
    <div class="debug-panel" id="debug-panel">
        <h3>🔍 Debug Information</h3>
        <div id="debug-content">
            <p style="color: #999;">Click on the map to see request/response details</p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize map
        const map = L.map('map').setView([30, 0], 2);

        // Add tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18,
        }).addTo(map);

        // Current year
        let currentYear = 2024;

        // Logarithmic time slider conversion
        // Maps slider position (0-100) to years with more detail for recent history
        function sliderToYear(position) {
            // Three-phase logarithmic scale:
            // 0-30: -3000 to -100 (ancient history, less detail)
            // 30-60: -100 to 500 (classical/medieval, medium detail)
            // 60-100: 500 to 2024 (modern history, high detail)

            if (position <= 30) {
                // Ancient: -3000 to -100
                const t = position / 30;
                return Math.round(-3000 + t * 2900);
            } else if (position <= 60) {
                // Classical/Medieval: -100 to 500
                const t = (position - 30) / 30;
                return Math.round(-100 + t * 600);
            } else {
                // Modern: 500 to 2024
                const t = (position - 60) / 40;
                return Math.round(500 + t * 1524);
            }
        }

        function yearToSlider(year) {
            // Reverse mapping for initialization
            if (year <= -100) {
                const t = (year + 3000) / 2900;
                return Math.round(t * 30);
            } else if (year <= 500) {
                const t = (year + 100) / 600;
                return Math.round(30 + t * 30);
            } else {
                const t = (year - 500) / 1524;
                return Math.round(60 + t * 40);
            }
        }

        // Time slider
        const timeSlider = document.getElementById('time-slider');
        const yearDisplay = document.getElementById('year-display');

        timeSlider.addEventListener('input', (e) => {
            const position = parseInt(e.target.value);
            let year = sliderToYear(position);

            // Handle year zero: skip from -1 to 1
            if (year === 0) {
                year = (position > 50) ? 1 : -1;
            }

            currentYear = year;
            updateYearDisplay();
        });

        function updateYearDisplay() {
            if (currentYear < 0) {
                yearDisplay.textContent = `${Math.abs(currentYear)} BCE`;
            } else if (currentYear === 0) {
                yearDisplay.textContent = '1 BCE'; // Should never hit this
            } else {
                yearDisplay.textContent = `${currentYear} CE`;
            }
        }

        // Map click handler
        let currentMarker = null;

        map.on('click', async (e) => {
            const { lat, lng } = e.latlng;

            // Add or move marker
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }
            currentMarker = L.marker([lat, lng]).addTo(map);

            // Fetch historical info
            await fetchHistoricalInfo(lat, lng, currentYear);
        });

        async function fetchHistoricalInfo(lat, lng, year) {
            const infoPanel = document.getElementById('info-panel');
            infoPanel.innerHTML = `
                <div class="loading-message">
                    <div class="spinner"></div>
                    <p>🔍 Searching through time...</p>
                </div>
            `;

            try {
                const startTime = Date.now();
                const response = await fetch('/explore', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ lat, lng, year })
                });

                const data = await response.json();
                const loadTime = Date.now() - startTime;

                // Add loading time info
                data.loadTime = loadTime;

                // Update debug panel
                updateDebugPanel({ lat, lng, year }, data, loadTime);

                displayInfo(data);
            } catch (error) {
                infoPanel.innerHTML = '<div class="loading-message"><p>❌ Error fetching data</p></div>';
                console.error('Error:', error);
            }
        }

        // Category icons mapping
        const categoryIcons = {
            'overview': '📋',
            'politics': '⚖️',
            'culture': '🎨',
            'religion': '🕌',
            'science': '🔬',
            'economy': '💰',
            'diplomacy': '🤝',
            'society': '👥',
            'food': '🍽️',
            'facts': '💡'
        };

        function displayInfo(data) {
            const infoPanel = document.getElementById('info-panel');

            const cacheIndicator = data.from_cache
                ? `<span class="cache-badge">⚡ Cached (${data.loadTime}ms)</span>`
                : `<span class="cache-badge" style="background: #1a1a2e; color: #999;">🌐 Fresh (${data.loadTime}ms)</span>`;

            let html = `
                <div class="location-info fade-in">
                    <h2>${data.location}${cacheIndicator}</h2>
                    <p>${data.year < 0 ? Math.abs(data.year) + ' BCE' : data.year + ' CE'}</p>
                </div>

                <div class="category-icons fade-in">
            `;

            // Add category icons
            for (const [category, info] of Object.entries(data.categories)) {
                const icon = categoryIcons[category] || '📄';
                const displayName = category.charAt(0).toUpperCase() + category.slice(1);
                html += `
                    <div class="category-icon" onclick="scrollToCategory('${category}')">
                        <span class="icon">${icon}</span>
                        <span>${displayName}</span>
                    </div>
                `;
            }

            html += '</div>';

            // Display categories
            for (const [category, info] of Object.entries(data.categories)) {
                const confidencePercent = Math.round(info.confidence * 100);
                const confidenceText = getConfidenceText(info.confidence);
                const icon = categoryIcons[category] || '📄';

                html += `
                    <div class="category fade-in" id="category-${category}">
                        <h3>${icon} ${category.charAt(0).toUpperCase() + category.slice(1)}</h3>
                        <div class="category-content">${info.content}</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${confidencePercent}%"></div>
                        </div>
                        <div class="confidence-label">${confidenceText} (${confidencePercent}% confidence)</div>
                    </div>
                `;
            }

            infoPanel.innerHTML = html;
        }

        function scrollToCategory(category) {
            const element = document.getElementById('category-' + category);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                // Highlight active category icon
                document.querySelectorAll('.category-icon').forEach(icon => {
                    icon.classList.remove('active');
                });
                event.target.closest('.category-icon').classList.add('active');
            }
        }

        function getConfidenceText(confidence) {
            if (confidence >= 0.8) return '✓ Well-documented';
            if (confidence >= 0.6) return '⚠ Generally accepted';
            if (confidence >= 0.4) return '⚠ Limited evidence';
            return '❓ Speculative';
        }

        // Debug panel functions
        function toggleDebug() {
            const panel = document.getElementById('debug-panel');
            panel.classList.toggle('show');
        }

        function updateDebugPanel(requestData, responseData, loadTime) {
            const debugContent = document.getElementById('debug-content');

            const debugInfo = responseData.debug_info || {};
            const sourceOrder = debugInfo.source_order || [];
            const period = debugInfo.period || responseData.period || 'N/A';

            let html = `
                <div class="debug-item success">
                    <label>Request</label>
                    <value>Location: ${responseData.location}, Year: ${responseData.year}</value>
                </div>

                <div class="debug-item ${debugInfo.knowledge_base_hit ? 'success' : 'warning'}">
                    <label>Data Source</label>
                    <value>${sourceOrder.join(' → ')}</value>
                </div>

                <div class="debug-item">
                    <label>Load Time</label>
                    <value>${loadTime}ms ${responseData.from_cache ? '(cached)' : '(fresh)'}</value>
                </div>

                <div class="debug-item">
                    <label>Historical Period</label>
                    <value>${period}</value>
                </div>
            `;

            if (debugInfo.source_page) {
                html += `
                    <div class="debug-item">
                        <label>Source Page</label>
                        <value>${debugInfo.source_page}</value>
                    </div>
                `;
            }

            html += `
                <div class="debug-item">
                    <label>Full Response (F12 Console)</label>
                    <div class="debug-json">${JSON.stringify(responseData, null, 2)}</div>
                </div>
            `;

            debugContent.innerHTML = html;

            // Also log to console for F12 inspection
            console.group('🔍 Continuum Debug Info');
            console.log('Request:', requestData);
            console.log('Response:', responseData);
            console.log('Load Time:', loadTime + 'ms');
            console.groupEnd();
        }

        // Initialize year display
        updateYearDisplay();
    </script>
</body>
</html>
