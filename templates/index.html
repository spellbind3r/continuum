<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuum - Historical World Explorer</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Three.js (required for Globe.gl) -->
    <script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>

    <!-- Globe.gl -->
    <script src="https://unpkg.com/globe.gl@2.31.0/dist/globe.gl.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto 1fr;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        header {
            grid-column: 1 / -1;
            background: #16213e;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #0f3460;
            font-size: 28px;
        }

        .time-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 600px;
        }

        .time-slider-container {
            width: 100%;
            position: relative;
        }

        .time-slider {
            width: 100%;
        }

        .time-markers {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 5px;
            font-size: 11px;
            color: #999;
        }

        .time-marker {
            text-align: center;
            flex: 1;
        }

        #year-display {
            font-size: 20px;
            font-weight: bold;
            color: #e94560;
            min-width: 120px;
            text-align: center;
        }

        .map-view-container {
            position: relative;
            height: 100%;
        }

        #map, #globe {
            height: 100%;
            border-radius: 8px;
            border: 2px solid #0f3460;
        }

        #map.active, #globe.active {
            display: block;
        }

        .view-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            border: 2px solid #4facfe;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            z-index: 1000;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        .view-toggle:hover {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
        }

        .view-toggle:active {
            transform: scale(0.98);
        }

        /* Layer controls for 3D globe */
        .layer-controls {
            position: absolute;
            top: 80px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            border: 2px solid #4facfe;
            border-radius: 10px;
            padding: 15px;
            z-index: 1000;
            display: none;
            min-width: 200px;
        }

        .layer-controls.show {
            display: block;
        }

        .layer-controls h4 {
            margin: 0 0 10px 0;
            color: #4facfe;
            font-size: 14px;
            font-weight: 600;
        }

        .layer-option {
            display: flex;
            align-items: center;
            margin: 8px 0;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .layer-option:hover {
            background: rgba(79, 172, 254, 0.1);
        }

        .layer-option input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .layer-option label {
            cursor: pointer;
            font-size: 13px;
            flex: 1;
        }

        .layer-option.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .layer-option.disabled label,
        .layer-option.disabled input {
            cursor: not-allowed;
        }

        .info-panel {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            border: 2px solid #0f3460;
        }

        .category {
            margin-bottom: 20px;
            padding: 15px;
            background: #1a1a2e;
            border-radius: 6px;
            border-left: 4px solid #e94560;
        }

        .category h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .category-content {
            color: #ddd;
            line-height: 1.6;
        }

        .confidence-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #f39c12);
            transition: width 0.3s ease;
        }

        .confidence-label {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .location-info {
            background: #0f3460;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .location-info h2 {
            color: #fff;
            margin-bottom: 5px;
        }

        .location-info p {
            color: #aaa;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            color: #999;
            margin-bottom: 10px;
        }

        .category-icons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .category-icon {
            background: #1a1a2e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .category-icon:hover {
            background: #0f3460;
            border-color: #e94560;
            transform: translateY(-2px);
        }

        .category-icon.active {
            background: #0f3460;
            border-color: #e94560;
        }

        .category-icon .icon {
            font-size: 18px;
        }

        /* Loading spinner */
        .spinner {
            width: 50px;
            height: 50px;
            margin: 20px auto;
            border: 4px solid #333;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-message {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .loading-message p {
            margin-top: 10px;
            font-size: 14px;
        }

        /* Cache indicator */
        .cache-badge {
            display: inline-block;
            background: #0f3460;
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 10px;
        }

        /* Fade in animation */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Debug panel and controls */
        .debug-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0f3460;
            color: #fff;
            border: 2px solid #e94560;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .debug-toggle:hover {
            background: #e94560;
            transform: scale(1.05);
        }

        .refresh-button {
            position: fixed;
            bottom: 20px;
            right: 160px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: none;
        }

        .refresh-button.show {
            display: block;
        }

        .refresh-button:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .refresh-button:active {
            transform: scale(0.98);
        }

        .refresh-button.refreshing {
            opacity: 0.6;
            cursor: wait;
        }

        .llm-button {
            position: fixed;
            bottom: 20px;
            right: 320px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            border: 2px solid #f093fb;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: none;
        }

        .llm-button.show {
            display: block;
        }

        .llm-button:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }

        .llm-button:active {
            transform: scale(0.98);
        }

        .llm-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .llm-button.enhancing {
            opacity: 0.6;
            cursor: wait;
        }

        /* Enhanced narrative styling */
        .enhanced-narrative {
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.1) 0%, rgba(245, 87, 108, 0.1) 100%);
            border: 2px solid #f093fb;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            position: relative;
        }

        .enhanced-narrative::before {
            content: "✨ AI-Enhanced Narrative";
            position: absolute;
            top: -12px;
            left: 15px;
            background: #0a1929;
            padding: 2px 10px;
            font-size: 11px;
            color: #f093fb;
            font-weight: 600;
            border-radius: 10px;
        }

        .enhanced-narrative .content {
            color: #e0e0e0;
            line-height: 1.8;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .debug-panel {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 350px;
            max-height: 400px;
            background: #16213e;
            border: 2px solid #e94560;
            border-radius: 8px;
            padding: 15px;
            z-index: 999;
            overflow-y: auto;
            display: none;
            font-size: 12px;
        }

        .debug-panel.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .debug-panel h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .debug-item {
            background: #1a1a2e;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid #0f3460;
        }

        .debug-item.success {
            border-left-color: #4ade80;
        }

        .debug-item.warning {
            border-left-color: #f39c12;
        }

        .debug-item label {
            color: #999;
            font-size: 10px;
            text-transform: uppercase;
        }

        .debug-item value {
            color: #fff;
            display: block;
            margin-top: 4px;
        }

        .debug-json {
            background: #0a0a0a;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #4ade80;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 Continuum <span style="font-size: 14px; color: #667eea; font-weight: 400;">{{ version }}</span></h1>
            <div class="time-control">
                <span id="year-display">2024 CE</span>
                <div class="time-slider-container">
                    <input type="range" id="time-slider" class="time-slider"
                           min="0" max="100" value="100" step="1">
                    <div class="time-markers">
                        <div class="time-marker" style="left: 0%;">3000 BCE</div>
                        <div class="time-marker" style="left: 20%;">2000 BCE</div>
                        <div class="time-marker" style="left: 30%;">0 CE</div>
                        <div class="time-marker" style="left: 45%;">500</div>
                        <div class="time-marker" style="left: 60%;">1500</div>
                        <div class="time-marker" style="left: 80%;">1900</div>
                        <div class="time-marker" style="left: 100%;">Today</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="map-view-container">
            <div id="map" class="active"></div>
            <div id="globe" style="display: none;"></div>
            <button class="view-toggle" id="view-toggle" onclick="toggleView()">
                🌍 3D Globe
            </button>

            <!-- Layer controls (only visible in 3D mode) -->
            <div class="layer-controls" id="layer-controls">
                <h4>🗺️ Historical Layers</h4>
                <div class="layer-option">
                    <input type="checkbox" id="layer-kingdoms" checked onchange="toggleLayer('kingdoms')">
                    <label for="layer-kingdoms">⚔️ Kingdoms & Empires</label>
                </div>
                <div class="layer-option disabled" title="Coming soon">
                    <input type="checkbox" id="layer-languages" disabled>
                    <label for="layer-languages">🗣️ Languages (Coming Soon)</label>
                </div>
                <div class="layer-option disabled" title="Coming soon">
                    <input type="checkbox" id="layer-religions" disabled>
                    <label for="layer-religions">🕌 Religions (Coming Soon)</label>
                </div>
            </div>
        </div>

        <div class="info-panel" id="info-panel">
            <div class="empty-state">
                <h3>👆 Click anywhere on the map</h3>
                <p>Explore history across time and space</p>
            </div>
        </div>
    </div>

    <!-- Debug Panel and Controls -->
    <button class="refresh-button" id="refresh-button" onclick="forceRefresh()">🔄 Dig Deeper</button>
    <button class="llm-button" id="llm-button" onclick="enhanceWithLLM()">✨ Tell me more!</button>
    <button class="debug-toggle" onclick="toggleDebug()">🔧 Debug</button>
    <div class="debug-panel" id="debug-panel">
        <h3>🔍 Debug Information</h3>
        <div id="debug-content">
            <p style="color: #999;">Click on the map to see request/response details</p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Historical Boundaries Data -->
    <script src="/static/js/historical_boundaries.js"></script>

    <script>
        // Initialize map
        const map = L.map('map').setView([30, 0], 2);

        // Add tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18,
        }).addTo(map);

        // Initialize 3D Globe
        let globe = null;
        let currentView = '2d'; // '2d' or '3d'
        let historicalPolygons = []; // Will hold historical boundary data
        let activeLayers = {
            kingdoms: true,
            languages: false,
            religions: false
        };

        function initGlobe() {
            if (globe) return; // Already initialized

            globe = Globe()
                (document.getElementById('globe'))
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
                .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                .width(document.getElementById('globe').clientWidth)
                .height(document.getElementById('globe').clientHeight)
                .polygonsData([]) // Will be populated with historical boundaries
                .polygonAltitude(0.01)
                .polygonCapColor(() => 'rgba(230, 100, 100, 0.3)')
                .polygonSideColor(() => 'rgba(230, 100, 100, 0.2)')
                .polygonStrokeColor(() => '#e94560')
                .polygonLabel(({ properties: d }) => `
                    <div style="background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px;">
                        <b>${d.name || 'Unknown'}</b><br/>
                        ${d.type ? `Type: ${d.type}<br/>` : ''}
                        ${d.period ? `Period: ${d.period}` : ''}
                    </div>
                `)
                .onGlobeClick((coords, event) => {
                    handleGlobeClick(coords.lat, coords.lng);
                });

            // Set initial camera position
            globe.pointOfView({ lat: 30, lng: 0, altitude: 2.5 });
        }

        function handleGlobeClick(lat, lng) {
            // Store clicked location for "Dig Deeper" button
            lastClickedLocation = { lat, lng };

            // Show the refresh button
            const refreshButton = document.getElementById('refresh-button');
            refreshButton.classList.add('show');

            // Fetch historical info
            fetchHistoricalInfo(lat, lng, currentYear);
        }

        function toggleView() {
            const mapEl = document.getElementById('map');
            const globeEl = document.getElementById('globe');
            const toggleBtn = document.getElementById('view-toggle');
            const layerControls = document.getElementById('layer-controls');

            if (currentView === '2d') {
                // Switch to 3D globe
                currentView = '3d';
                mapEl.style.display = 'none';
                mapEl.classList.remove('active');
                globeEl.style.display = 'block';
                globeEl.classList.add('active');
                toggleBtn.innerHTML = '🗺️ 2D Map';
                layerControls.classList.add('show');

                // Initialize globe if not already done
                initGlobe();

                // Update globe size
                if (globe) {
                    globe
                        .width(globeEl.clientWidth)
                        .height(globeEl.clientHeight);

                    // Load historical boundaries for current year
                    updateHistoricalLayers(currentYear);
                }
            } else {
                // Switch to 2D map
                currentView = '2d';
                globeEl.style.display = 'none';
                globeEl.classList.remove('active');
                mapEl.style.display = 'block';
                mapEl.classList.add('active');
                toggleBtn.innerHTML = '🌍 3D Globe';
                layerControls.classList.remove('show');

                // Invalidate map size to fix rendering issues
                setTimeout(() => map.invalidateSize(), 100);
            }
        }

        function toggleLayer(layerType) {
            activeLayers[layerType] = !activeLayers[layerType];
            // Update globe with filtered layers
            updateHistoricalLayers(currentYear);
        }

        // Function to load historical boundary data for a given year
        function updateHistoricalLayers(year) {
            if (!globe) return;

            // Load historical boundaries based on year
            // This will be populated with actual historical data
            const boundaries = getHistoricalBoundaries(year);

            globe.polygonsData(boundaries);
        }

        // Get historical boundaries for a specific year
        function getHistoricalBoundaries(year) {
            // Use the helper function from historical_boundaries.js
            if (typeof getHistoricalBoundariesForYear === 'function') {
                const allBoundaries = getHistoricalBoundariesForYear(year);

                // Filter by active layers
                return allBoundaries.filter(boundary => {
                    const layerType = boundary.properties.layer_type;
                    return activeLayers[layerType] === true;
                });
            }

            // Fallback if historical data not loaded
            console.warn('Historical boundaries data not loaded');
            return [];
        }

        // Current year
        let currentYear = 2024;

        // Logarithmic time slider conversion
        // Maps slider position (0-100) to years with more detail for recent history
        function sliderToYear(position) {
            // Three-phase logarithmic scale:
            // 0-30: -3000 to -100 (ancient history, less detail)
            // 30-60: -100 to 500 (classical/medieval, medium detail)
            // 60-100: 500 to 2024 (modern history, high detail)

            if (position <= 30) {
                // Ancient: -3000 to -100
                const t = position / 30;
                return Math.round(-3000 + t * 2900);
            } else if (position <= 60) {
                // Classical/Medieval: -100 to 500
                const t = (position - 30) / 30;
                return Math.round(-100 + t * 600);
            } else {
                // Modern: 500 to 2024
                const t = (position - 60) / 40;
                return Math.round(500 + t * 1524);
            }
        }

        function yearToSlider(year) {
            // Reverse mapping for initialization
            if (year <= -100) {
                const t = (year + 3000) / 2900;
                return Math.round(t * 30);
            } else if (year <= 500) {
                const t = (year + 100) / 600;
                return Math.round(30 + t * 30);
            } else {
                const t = (year - 500) / 1524;
                return Math.round(60 + t * 40);
            }
        }

        // Time slider
        const timeSlider = document.getElementById('time-slider');
        const yearDisplay = document.getElementById('year-display');

        // Debounce timer for slider
        let sliderDebounceTimer = null;

        timeSlider.addEventListener('input', (e) => {
            const position = parseInt(e.target.value);
            let year = sliderToYear(position);

            // Handle year zero: skip from -1 to 1
            if (year === 0) {
                year = (position > 50) ? 1 : -1;
            }

            currentYear = year;
            updateYearDisplay();

            // Update historical layers on globe if in 3D view
            if (currentView === '3d') {
                clearTimeout(sliderDebounceTimer);
                sliderDebounceTimer = setTimeout(() => {
                    updateHistoricalLayers(currentYear);
                }, 300); // Update layers as slider moves
            }

            // If a location has been clicked, refresh data for new year
            if (lastClickedLocation) {
                // Debounce to avoid too many requests while sliding
                clearTimeout(sliderDebounceTimer);
                sliderDebounceTimer = setTimeout(() => {
                    fetchHistoricalInfo(lastClickedLocation.lat, lastClickedLocation.lng, currentYear);
                }, 500); // Wait 500ms after user stops sliding
            }
        });

        function updateYearDisplay() {
            if (currentYear < 0) {
                yearDisplay.textContent = `${Math.abs(currentYear)} BCE`;
            } else if (currentYear === 0) {
                yearDisplay.textContent = '1 BCE'; // Should never hit this
            } else {
                yearDisplay.textContent = `${currentYear} CE`;
            }
        }

        // Map click handler
        let currentMarker = null;
        let lastClickedLocation = null; // Track last clicked location

        map.on('click', async (e) => {
            const { lat, lng } = e.latlng;

            // Add or move marker
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }
            currentMarker = L.marker([lat, lng]).addTo(map);

            // Store location for slider-triggered refreshes
            lastClickedLocation = { lat, lng };

            // Show refresh button
            document.getElementById('refresh-button').classList.add('show');

            // Fetch historical info
            await fetchHistoricalInfo(lat, lng, currentYear);
        });

        async function fetchHistoricalInfo(lat, lng, year, bypassCache = false, useLLM = false) {
            const infoPanel = document.getElementById('info-panel');
            let loadingMsg = '🔍 Searching through time...';
            if (useLLM) loadingMsg = '✨ Enhancing with AI...';
            else if (bypassCache) loadingMsg = '🔍 Digging deeper...';

            infoPanel.innerHTML = `
                <div class="loading-message">
                    <div class="spinner"></div>
                    <p>${loadingMsg}</p>
                </div>
            `;

            try {
                const startTime = Date.now();
                const response = await fetch('/explore', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ lat, lng, year, bypass_cache: bypassCache, use_llm: useLLM })
                });

                const data = await response.json();
                const loadTime = Date.now() - startTime;

                // Add loading time info
                data.loadTime = loadTime;

                // Update debug panel
                updateDebugPanel({ lat, lng, year, bypass_cache: bypassCache, use_llm: useLLM }, data, loadTime);

                displayInfo(data);
            } catch (error) {
                infoPanel.innerHTML = '<div class="loading-message"><p>❌ Error fetching data</p></div>';
                console.error('Error:', error);
            }
        }

        // Category icons mapping
        const categoryIcons = {
            'overview': '📋',
            'politics': '⚖️',
            'culture': '🎨',
            'religion': '🕌',
            'science': '🔬',
            'economy': '💰',
            'diplomacy': '🤝',
            'society': '👥',
            'food': '🍽️',
            'facts': '💡'
        };

        function displayInfo(data) {
            const infoPanel = document.getElementById('info-panel');

            const cacheIndicator = data.from_cache
                ? `<span class="cache-badge">⚡ Cached (${data.loadTime}ms)</span>`
                : `<span class="cache-badge" style="background: #1a1a2e; color: #999;">🌐 Fresh (${data.loadTime}ms)</span>`;

            let html = `
                <div class="location-info fade-in">
                    <h2>${data.location}${cacheIndicator}</h2>
                    <p>${data.year < 0 ? Math.abs(data.year) + ' BCE' : data.year + ' CE'}</p>
                </div>

                <div class="category-icons fade-in">
            `;

            // Add category icons
            for (const [category, info] of Object.entries(data.categories)) {
                const icon = categoryIcons[category] || '📄';
                const displayName = category.charAt(0).toUpperCase() + category.slice(1);
                html += `
                    <div class="category-icon" onclick="scrollToCategory('${category}')">
                        <span class="icon">${icon}</span>
                        <span>${displayName}</span>
                    </div>
                `;
            }

            html += '</div>';

            // Display categories
            for (const [category, info] of Object.entries(data.categories)) {
                const confidencePercent = Math.round(info.confidence * 100);
                const confidenceText = getConfidenceText(info.confidence);
                const icon = categoryIcons[category] || '📄';

                html += `
                    <div class="category fade-in" id="category-${category}">
                        <h3>${icon} ${category.charAt(0).toUpperCase() + category.slice(1)}</h3>
                        <div class="category-content">${info.content}</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${confidencePercent}%"></div>
                        </div>
                        <div class="confidence-label">${confidenceText} (${confidencePercent}% confidence)</div>
                    </div>
                `;
            }

            // Display LLM-enhanced narrative if present
            if (data.enhanced_narrative) {
                html += `
                    <div class="enhanced-narrative fade-in">
                        <div class="content">${data.enhanced_narrative.content}</div>
                    </div>
                `;
            }

            infoPanel.innerHTML = html;

            // Show LLM button if available and data is from knowledge base
            const llmButton = document.getElementById('llm-button');
            const debugInfo = data.debug_info || {};
            const llmAvailable = debugInfo.llm_available !== false;
            const hasKBData = debugInfo.knowledge_base_hit === true;

            if (llmAvailable && hasKBData && !data.enhanced_narrative) {
                llmButton.classList.add('show');
            } else if (data.enhanced_narrative) {
                // Hide button once enhanced
                llmButton.classList.remove('show');
            }
        }

        function scrollToCategory(category) {
            const element = document.getElementById('category-' + category);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                // Highlight active category icon
                document.querySelectorAll('.category-icon').forEach(icon => {
                    icon.classList.remove('active');
                });
                event.target.closest('.category-icon').classList.add('active');
            }
        }

        function getConfidenceText(confidence) {
            if (confidence >= 0.8) return '✓ Well-documented';
            if (confidence >= 0.6) return '⚠ Generally accepted';
            if (confidence >= 0.4) return '⚠ Limited evidence';
            return '❓ Speculative';
        }

        // Debug panel functions
        function toggleDebug() {
            const panel = document.getElementById('debug-panel');
            panel.classList.toggle('show');
        }

        async function forceRefresh() {
            if (!lastClickedLocation) {
                alert('Please click on a location first!');
                return;
            }

            const button = document.getElementById('refresh-button');
            button.classList.add('refreshing');
            button.textContent = '🔄 Refreshing...';

            try {
                // Force bypass cache
                await fetchHistoricalInfo(
                    lastClickedLocation.lat,
                    lastClickedLocation.lng,
                    currentYear,
                    true // bypass_cache
                );

                // Show LLM button after successful knowledge base fetch
                const llmButton = document.getElementById('llm-button');
                llmButton.classList.add('show');
            } finally {
                button.classList.remove('refreshing');
                button.textContent = '🔄 Dig Deeper';
            }
        }

        async function enhanceWithLLM() {
            if (!lastClickedLocation) {
                alert('Please click on a location first!');
                return;
            }

            const button = document.getElementById('llm-button');
            button.classList.add('enhancing');
            button.disabled = true;
            button.textContent = '✨ Enhancing...';

            try {
                // Request LLM enhancement
                await fetchHistoricalInfo(
                    lastClickedLocation.lat,
                    lastClickedLocation.lng,
                    currentYear,
                    true,  // bypass_cache
                    true   // use_llm
                );
            } catch (error) {
                console.error('LLM enhancement error:', error);
                alert('Failed to enhance with AI. Please check your API key configuration.');
            } finally {
                button.classList.remove('enhancing');
                button.disabled = false;
                button.textContent = '✨ Tell me more!';
            }
        }

        function updateDebugPanel(requestData, responseData, loadTime) {
            const debugContent = document.getElementById('debug-content');

            const debugInfo = responseData.debug_info || {};
            const sourceOrder = debugInfo.source_order || [];
            const period = debugInfo.period || responseData.period || 'N/A';

            let html = `
                <div class="debug-item success">
                    <label>Request Sent</label>
                    <div class="debug-json" style="font-size: 11px; margin-top: 5px;">
POST /explore
{
  "lat": ${requestData.lat.toFixed(2)},
  "lng": ${requestData.lng.toFixed(2)},
  "year": ${requestData.year}${requestData.bypass_cache ? ',\n  "bypass_cache": true' : ''}
}</div>
                </div>

                <div class="debug-item">
                    <label>Detected Location</label>
                    <value>${responseData.location}</value>
                </div>

                <div class="debug-item ${debugInfo.knowledge_base_hit ? 'success' : (debugInfo.cache_hit ? 'info' : 'warning')}">
                    <label>Data Source</label>
                    <value>${sourceOrder.join(' → ')}</value>
                </div>

                <div class="debug-item">
                    <label>Load Time</label>
                    <value>${loadTime}ms ${responseData.from_cache ? '⚡ cached' : '🌐 fresh'}</value>
                </div>

                <div class="debug-item">
                    <label>Historical Period</label>
                    <value>${period}</value>
                </div>
            `;

            if (debugInfo.source_page) {
                html += `
                    <div class="debug-item">
                        <label>Source Page</label>
                        <value>${debugInfo.source_page}</value>
                    </div>
                `;
            }

            html += `
                <div class="debug-item">
                    <label>Full Response (also in F12 Console)</label>
                    <div class="debug-json" style="max-height: 300px; overflow-y: auto;">${JSON.stringify(responseData, null, 2)}</div>
                </div>
            `;

            debugContent.innerHTML = html;

            // Also log to console for F12 inspection
            console.group('🔍 Continuum Debug Info');
            console.log('Request:', requestData);
            console.log('Response:', responseData);
            console.log('Load Time:', loadTime + 'ms');
            console.groupEnd();
        }

        // Initialize year display
        // Set currentYear from initial slider position
        currentYear = sliderToYear(parseInt(timeSlider.value));
        updateYearDisplay();
    </script>
</body>
</html>
